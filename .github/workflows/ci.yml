name: CI workflow

on:
  push:

jobs:
  build: # Job name
      runs-on: ubuntu-latest # Github Runner (Free)
      steps:
        - name: Checkout code # Step name
          uses: actions/checkout@v4 # Clone the code into a ubunty runner

        - name: Setup Docker
          uses: docker/setup-buildx-action@v4

        - uses: docker/login-action@v4 # to authenticate
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:shyam
